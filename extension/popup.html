<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>URCT Translator</title>
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #202b3b;
    }
    h2 { margin: 0 0 5px; }
    p { font-size: 12px; color: #667085; }
    label { display: block; margin: 12px 0 5px; }
    select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 7px;
      font: inherit;
    }
    textarea {
      border: 1px solid #cbd5e1;
      min-height: 78px;
      resize: vertical;
    }
    select { border: 1px solid #cbd5e1; }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      margin-top: 10px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; }
    #copy { background: #334155; }
    #status { min-height: 18px; }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
    }

    section {
      margin-bottom: 15px;
    }

    [hidden] {
      display: none !important;
    }

    #login-status {
      color: #b42318;
    }

    #account-panel {
      padding: 10px;
      border-radius: 7px;
      background: #eaf2fb;
    }


    #contacts-panel {
      margin-top: 20px;
    }

    .site-node {
      padding: 10px;
      margin-top: 8px;
      background: #e8eef6;
      border-radius: 7px;
    }

    .site-title {
      cursor: pointer;
      font-weight: bold;
    }

    .contact-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 7px 0 0 14px;
      padding: 7px;
      background: white;
      border-radius: 5px;
    }

    .contact-item button {
      width: auto;
      margin: 0;
      padding: 6px 9px;
      background: #b42318;
    }

    .contact-info {
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    #tree-status,
    #contact-status {
      font-size: 12px;
    }
    input[type="checkbox"] {
      width: auto;
      margin-right: 6px;
    }

    #contact-detail-panel {
      margin-top: 18px;
      padding: 12px;
      background: #eaf2fb;
      border-radius: 8px;
    }


    #history-panel {
      margin-top: 16px;
      padding: 12px;
      background: #eef3fa;
      border-radius: 8px;
    }

    .history-conversation {
      padding: 10px;
      margin: 8px 0;
      background: white;
      border-radius: 7px;
    }

    .history-message {
      padding: 10px;
      margin-top: 8px;
      background: white;
      border: 1px solid #d8e1eb;
      border-radius: 7px;
    }

    .history-original {
      margin: 7px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .history-translation {
      margin: 7px 0;
      padding: 8px;
      background: #e6f3ff;
      border-radius: 5px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .history-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .history-actions button {
      width: auto;
      flex: 1;
      margin: 0;
    }

    .history-delete {
      background: #b42318;
    }

    .history-label {
      color: #667085;
      font-size: 12px;
    }

    [hidden] {
      display: none !important;
    }

  </style>
</head>
<body>
  <section id="login-panel">
    <h2>URCT Login</h2>

    <label for="username">Username</label>
    <input
      id="username"
      type="text"
      value="owner"
      autocomplete="username"
    />

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="URCT password"
    />

    <button id="login-btn">Login</button>

    <p id="login-status"></p>
  </section>

  <section id="account-panel" hidden>
    <p id="account-name"></p>
    <button id="logout-btn">Logout</button>
    <p id="connection-status"></p>
  </section>
  <section id="translator-panel" hidden>
    <h2>URCT Translator</h2>
    <p>실시간 채팅 번역 · API 연결 테스트</p>

    <label for="target">상대방의 언어</label>
    <select id="target">
      <option value="en">English</option>
      <option value="ko">한국어</option>
    </select>

    <label for="source">내가 작성한 메시지</label>
    <textarea id="source"
      placeholder="메시지를 입력하세요..."></textarea>

    <button id="translate">번역하기</button>

    <label for="result">번역 결과</label>
    <textarea id="result" readonly></textarea>

    <button id="copy" disabled>번역문 복사</button>

    <p id="status">서버 연결 대기 중</p>
    <p>현재 버전: DEMO · 실제 AI 모델 미연결</p>

    <hr>

    <section id="contacts-panel">
      <h2>Conversation Explorer</h2>

      <button id="refresh-tree">
        Refresh Contacts
      </button>

      <p id="tree-status"></p>
      <div id="site-tree"></div>

      <h3>Add Contact</h3>

      <label for="contact-site">Chat Site</label>
      <select id="contact-site"></select>

      <label for="contact-name">Contact Name</label>
      <input
        id="contact-name"
        type="text"
        placeholder="Contact name"
      >

      <button id="add-contact">
        Add Contact
      </button>

      <p id="contact-status"></p>
    </section>

    <section id="contact-detail-panel" hidden>
      <hr>
      <h2>Contact Details</h2>

      <p id="detail-contact-name"></p>

      <label for="detail-language">Recipient Language</label>
      <select id="detail-language">
        <option value="en">English</option>
      </select>

      <label for="detail-mode">Conversation Mode</label>
      <select id="detail-mode">
        <option value="auto">Auto Adaptive</option>
        <option value="social">Social</option>
        <option value="professional">Professional</option>
        <option value="interview">Interview</option>
        <option value="technical">Technical</option>
      </select>

      <label for="detail-style">Translation Style</label>
      <select id="detail-style">
        <option value="natural">Natural</option>
        <option value="literal">Literal</option>
        <option value="cultural">Cultural</option>
      </select>

      <label>
        <input id="detail-auto-detect"
              type="checkbox" checked>
        Automatic language detection
      </label>

      <button id="detail-save">Save Settings</button>
      <button id="detail-close" type="button">
        Close Details
      </button>

      <p id="detail-status"></p>
    </section>

    <section id="history-panel" hidden>
      <hr>
      <h2>Conversation History</h2>

      <p id="history-contact"></p>

      <button id="history-refresh" type="button">
        Refresh History
      </button>

      <button id="history-new" type="button">
        New Conversation
      </button>

      <p id="history-status"></p>

      <div id="history-conversations"></div>

      <div id="history-messages"></div>

      <button id="history-close" type="button">
        Close History
      </button>
    </section>

    <section id="archive-test-panel">
      <hr>

      <h3>WebSocket Archive Test</h3>

      <button id="archive-test-new" type="button">
        Send New Test Event
      </button>

      <button id="archive-test-repeat" type="button">
        Resend Same Event
      </button>

      <p id="archive-test-status">
        No test performed.
      </p>
    </section>


    <section id="chat-message-panel">
      <hr>

      <h2>URCT ChatMessage</h2>
      <p>Save a message to the selected contact.</p>

      <label for="chat-direction">Direction</label>
      <select id="chat-direction">
        <option value="incoming">Incoming</option>
        <option value="outgoing">Outgoing</option>
      </select>

      <label for="chat-original">Original Message</label>
      <textarea
        id="chat-original"
        placeholder="Enter the original message..."
      ></textarea>

      <label for="chat-translated">Translated Message</label>
      <textarea
        id="chat-translated"
        placeholder="Enter the translated message..."
      ></textarea>

      <button id="chat-save" type="button">
        Save ChatMessage
      </button>

      <p id="chat-save-status">No message saved yet.</p>
    </section>


  </section>


  <script src="auth.js"></script>
  <script src="popup.js"></script>
  <script src="history_ui.js"></script>
  <script src="contact_detail.js"></script>
  <script src="contact_tree.js"></script>
  <script src="archive_test.js"></script>
  <script src="chat_message.js"></script>
</body>
</html>
