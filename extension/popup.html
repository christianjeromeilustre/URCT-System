<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>URCT Translator</title>
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #202b3b;
    }
    h2 { margin: 0 0 5px; }
    p { font-size: 12px; color: #667085; }
    label { display: block; margin: 12px 0 5px; }
    select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 7px;
      font: inherit;
    }
    textarea {
      border: 1px solid #cbd5e1;
      min-height: 78px;
      resize: vertical;
    }
    select { border: 1px solid #cbd5e1; }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      margin-top: 10px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; }
    #copy { background: #334155; }
    #status { min-height: 18px; }

    input {
  width: 100%;
  box-sizing: border-box;
  padding: 10px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
}

section {
  margin-bottom: 15px;
}

[hidden] {
  display: none !important;
}

#login-status {
  color: #b42318;
}

#account-panel {
  padding: 10px;
  border-radius: 7px;
  background: #eaf2fb;
}
  </style>
</head>
<body>
  <section id="login-panel">
    <h2>URCT Login</h2>

    <label for="username">Username</label>
    <input
      id="username"
      type="text"
      value="owner"
      autocomplete="username"
    />

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="URCT password"
    />

    <button id="login-btn">Login</button>

    <p id="login-status"></p>
  </section>

<section id="account-panel" hidden>
  <p id="account-name"></p>
  <button id="logout-btn">Logout</button>
  <p id="connection-status"></p>
</section>
<section id="translator-panel" hidden>
  <h2>URCT Translator</h2>
  <p>실시간 채팅 번역 · API 연결 테스트</p>

  <label for="target">상대방의 언어</label>
  <select id="target">
    <option value="en">English</option>
    <option value="ko">한국어</option>
  </select>

  <label for="source">내가 작성한 메시지</label>
  <textarea id="source"
    placeholder="메시지를 입력하세요..."></textarea>

  <button id="translate">번역하기</button>

  <label for="result">번역 결과</label>
  <textarea id="result" readonly></textarea>

  <button id="copy" disabled>번역문 복사</button>

  <p id="status">서버 연결 대기 중</p>
  <p>현재 버전: DEMO · 실제 AI 모델 미연결</p>
</section>
  <script src="auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
